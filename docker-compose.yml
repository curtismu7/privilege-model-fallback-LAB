# OrbStack:  HOST_PORT=7836 docker compose up --build -d   ->  http://127.0.0.1:7836
# The server binds 0.0.0.0 INSIDE the container (PMF_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. 7836 is PROVISIONAL (not claimed on the board yet); HOST_PORT stays in 7800-7999.
name: privilege-model-fallback-lab

services:
  privilege-model-fallback-lab:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-7836}:7836"
    environment:
      PORT: "7836"
      PMF_BIND: 0.0.0.0
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7836/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
